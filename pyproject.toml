[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "askdocs"
version = "0.1.0"
description = "Ask My Docs: hybrid retrieval, cross-encoder reranking and enforced citations over one document collection."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "pymupdf>=1.24",
    "beautifulsoup4>=4.12",
    "markdown-it-py>=3.0",
    "tiktoken>=0.7",
    "rank-bm25>=0.2.2",
    "qdrant-client>=1.19,<1.20",
    "sentence-transformers>=4.0",
    "anthropic>=0.70",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "eval"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM905"]  # allow "a b c".split() word lists

[tool.ruff.lint.isort]
known-first-party = ["askdocs", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
]
