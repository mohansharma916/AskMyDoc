name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Unit tests
        run: pytest tests/ --cov=askdocs --cov-report=term-missing --cov-fail-under=70

  frontend:
    name: Frontend typecheck, tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: End-to-end (Playwright, mocked API)
        run: npx playwright install --with-deps chromium && npm run e2e
