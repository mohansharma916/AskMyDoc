name: Eval gate

# Runs the golden-set evaluation on pull requests that can change answer quality.
# Requires the ANTHROPIC_API_KEY repository secret. Optionally set the JUDGE_MODEL
# repository variable to use a different (e.g. cheaper) judge model.

on:
  pull_request:
    branches: [main]
    paths: ["src/**", "prompts/**", "eval/**"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports: ["6333:6333"]
    env:
      EVAL_QDRANT_URL: http://localhost:6333
      EVAL_REQUIRE_LLM: "1"
      LLM_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache embedding and reranker models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('src/askdocs/config.py') }}

      - name: Install
        run: pip install -e ".[dev,eval]"

      - name: Golden set is in sync with the corpus
        run: python -m eval.build_golden --check

      - name: Run eval gate
        run: pytest eval/ -v

      - name: Comment metrics on the PR
        if: always() && github.event_name == 'pull_request' && hashFiles('eval/report.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- askdocs-eval -->';
            const body = `${marker}\n${fs.readFileSync('eval/report.md', 'utf8')}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            eval/report.json
            eval/report.md
          if-no-files-found: ignore
