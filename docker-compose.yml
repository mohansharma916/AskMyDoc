services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: sqlite:////app/data/askdocs.db
      INGEST_ROOT: /app/data
      CORS_ORIGINS: http://localhost:${UI_PORT:-8080},http://localhost:5173
      OTEL_ENDPOINT: http://phoenix:6006/v1/traces
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - hf_models:/models   # embedding + reranker downloads survive rebuilds
    depends_on:
      - qdrant
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${UI_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:version-11.0.0
    profiles: ["tracing"]
    ports:
      - "6006:6006"   # UI and OTLP/HTTP at /v1/traces
    restart: unless-stopped

volumes:
  qdrant_data:
  hf_models:
