# Source of eval/golden.jsonl. Each answerable item lists exact evidence quotes
# from eval/corpus; `python -m eval.build_golden` maps them to supporting chunk ids.
# Mix: 30 single-fact, 10 multi-chunk, 10 unanswerable.

- id: g_001
  question: What are the core collaboration hours?
  expected_answer: 10:00 to 15:00 in each employee's local time zone.
  evidence: ["Core collaboration hours are 10:00 to 15:00"]
  tags: [single-fact, handbook]
- id: g_002
  question: How many days per week can I work remotely?
  expected_answer: Up to three days per week.
  evidence: ["work remotely up to three days per week"]
  tags: [single-fact, handbook]
- id: g_003
  question: How often are fully remote arrangements reviewed?
  expected_answer: Every six months.
  evidence: ["Fully remote arrangements are reviewed every six months"]
  tags: [single-fact, handbook]
- id: g_004
  question: Do I need approval to work from another country for six weeks?
  expected_answer: Yes. Working from another country for more than 30 days in a calendar year needs prior approval from People Operations.
  evidence: ["more than 30 days in a calendar year need prior approval from People Operations"]
  tags: [single-fact, handbook]
- id: g_005
  question: How many days of paid time off does a full-time employee get per year?
  expected_answer: 21 days per year (1.75 days per month).
  evidence: ["which is 21 days per year"]
  tags: [single-fact, handbook]
- id: g_006
  question: How many unused PTO days can be carried over into the next year?
  expected_answer: Up to 5 days; additional unused days expire on January 31.
  evidence: ["Up to 5 unused PTO days may be carried over"]
  tags: [single-fact, handbook]
- id: g_007
  question: How far in advance must I request two weeks of PTO?
  expected_answer: At least three weeks in advance, because the request is longer than five consecutive working days.
  evidence: ["must be submitted at least three weeks in advance"]
  tags: [single-fact, handbook]
- id: g_008
  question: How many paid sick days do employees get?
  expected_answer: Up to 10 paid sick days per year, which do not carry over.
  evidence: ["Employees receive up to 10 paid sick days per year"]
  tags: [single-fact, handbook]
- id: g_009
  question: When is a doctor's note required for sick leave?
  expected_answer: For absences longer than three consecutive working days.
  evidence: ["A doctor's note is required for absences longer than three consecutive working days"]
  tags: [single-fact, handbook]
- id: g_010
  question: How long is parental leave for primary caregivers?
  expected_answer: 20 weeks of fully paid parental leave.
  evidence: ["Primary caregivers receive 20 weeks of fully paid parental leave"]
  tags: [single-fact, handbook]
- id: g_011
  question: How much bereavement leave is there for an immediate family member?
  expected_answer: Up to 5 paid days.
  evidence: ["up to 5 paid days of bereavement leave"]
  tags: [single-fact, handbook]
- id: g_012
  question: What is the resignation notice period for people managers?
  expected_answer: 60 days for people managers and directors.
  evidence: ["60 days for people managers and directors"]
  tags: [single-fact, handbook]
- id: g_013
  question: How long is the probation period for new employees?
  expected_answer: Six months.
  evidence: ["probation period of six months"]
  tags: [single-fact, handbook]
- id: g_014
  question: When do performance reviews take place?
  expected_answer: Twice a year, in April and October.
  evidence: ["Performance reviews happen twice a year, in April and October"]
  tags: [single-fact, handbook]
- id: g_015
  question: Can I accept a gift from a supplier worth 80 USD?
  expected_answer: No. Supplier gifts worth more than 50 USD must be declined or reported.
  evidence: ["Gifts from suppliers worth more than 50 USD must be declined or reported"]
  tags: [single-fact, handbook]
