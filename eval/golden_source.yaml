- id: g_031
  question: How many paid days off do I get per year for PTO and sick leave combined?
  expected_answer: 31 days in total, 21 days of PTO plus up to 10 sick days.
  evidence: ["which is 21 days per year", "Employees receive up to 10 paid sick days per year"]
  tags: [multi-chunk, handbook]
- id: g_032
  question: What equipment and setup money does a new employee get?
  expected_answer: A laptop of their choice (macOS or Linux) and a one-time 750 USD home-office stipend.
  evidence: ["receives a laptop of their choice, either macOS or Linux", "one-time home-office stipend of 750 USD"]
  tags: [multi-chunk, security, benefits]
- id: g_033
  question: What happens to unused learning budget and unused PTO at the end of the year?
  expected_answer: Learning budget does not roll over; up to 5 unused PTO days can be carried over.
  evidence: ["Unused learning budget does not roll over", "Up to 5 unused PTO days may be carried over"]
  tags: [multi-chunk, handbook, benefits]
- id: g_034
  question: When can a platform engineer join on-call, and how are they paid for it?
  expected_answer: After three months at Northwind; they get 400 USD per on-call week.
  evidence: ["once they have been at Northwind for three months", "stipend of 400 USD per week of on-call duty"]
  tags: [multi-chunk, oncall]
- id: g_035
  question: For an 11-hour flight to Tokyo, what flight class and hotel budget apply?
  expected_answer: Business class is possible with vice-president approval (flight over ten hours); the Tokyo hotel limit is 250 USD per night.
  evidence: ["only allowed for flights longer than ten hours", "250 USD in New York, London, Tokyo and Zurich"]
  tags: [multi-chunk, travel]
- id: g_036
  question: What notice do I give if I resign during probation versus after it, as an individual contributor?
  expected_answer: Two weeks during probation, 30 days after probation.
  evidence: ["During probation the notice period is two weeks", "30 days for individual contributors"]
  tags: [multi-chunk, handbook]
- id: g_037
  question: What do health and dental cover include?
  expected_answer: Northwind pays 100% of the employee health premium (75% for dependants); dental includes two check-ups per year.
  evidence: ["pays 100% of the health insurance premium for employees", "Dental cover includes two check-ups per year"]
  tags: [multi-chunk, benefits]
- id: g_038
  question: Who can get a corporate card, and how soon must receipts be submitted?
  expected_answer: Employees travelling more than four times a year; receipts are due within 30 days of purchase.
  evidence: ["travel more than four times a year can request a corporate card", "within 30 days of purchase"]
  tags: [multi-chunk, travel]
- id: g_039
  question: How many paid volunteering days and paid learning days do I get per year?
  expected_answer: 2 volunteering days and 3 learning days.
  evidence: ["up to 2 paid volunteering days per year", "up to 3 paid learning days per year"]
  tags: [multi-chunk, handbook, benefits]
- id: g_040
  question: When are the offices open, and is there support for commuting costs?
  expected_answer: 07:00 to 21:00 on working days; office-based employees get a 100 USD monthly commuter allowance.
  evidence: ["open from 07:00 to 21:00 on working days", "commuter allowance of 100 USD per month"]
  tags: [multi-chunk, handbook, benefits]

