- id: g_029
  question: How much does Northwind match on retirement contributions?
  expected_answer: Up to 5% of base salary, vesting immediately.
  evidence: ["matches retirement contributions up to 5% of base salary"]
  tags: [single-fact, benefits]
- id: g_030
  question: How large is the monthly wellness stipend?
  expected_answer: 60 USD per month.
  evidence: ["monthly wellness stipend of 60 USD"]
